<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alles Gute zum Geburtstag, Elisa! ❤️</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .uploader {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            border: 2px dashed #ff9a9e;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        #fileInput {
            display: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ff416c;
            font-weight: 600;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding: 5px;
        }

        .gallery img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }

        /* Lightbox (Vollbild) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unsere gemeinsame Galerie ❤️</h1>

        <div class="uploader">
            <p style="margin-bottom: 10px; color: #555;">Füge neue Bilder für uns beide hinzu:</p>
            <label for="fileInput" class="upload-btn">📸 Bild hochladen</label>
            <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadImages(event)">
            <div id="status" class="status-msg"></div>
        </div>

        <div class="gallery" id="galleryGrid">
            <!-- Bilder werden hier automatisch geladen -->
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Vollbild">
    </div>

    <script>
        // Deine konfigurierten Projektdaten
        const firebaseConfig = {
            apiKey: "692943107043", // <--- HIER DEINEN API-KEY EINTRAGEN
            authDomain: "elisa-geburtstag.firebaseapp.com",
            projectId: "elisa-geburtstag",
            storageBucket: "elisa-geburtstag.appspot.com",
            messagingSenderId: "692943107043",
            appId: "elisa-geburtstag"  // <--- HIER DEINE APP-ID EINTRAGEN
        };

        // Firebase Initialisieren
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const db = firebase.firestore();

        const galleryGrid = document.getElementById('galleryGrid');
        const statusDiv = document.getElementById('status');

        // 1. Bilder in Echtzeit aus Firestore laden
        db.collection("photos").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            galleryGrid.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const img = document.createElement('img');
                img.src = data.url;
                img.onclick = () => openLightbox(data.url);
                galleryGrid.appendChild(img);
            });
        });

        // 2. Bilder hochladen & in der Cloud speichern
        async function uploadImages(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            statusDiv.innerText = "Lade hoch...";

            for (let file of files) {
                try {
                    const storageRef = storage.ref(`images/${Date.now()}_${file.name}`);
                    const uploadTask = await storageRef.put(file);
                    const downloadURL = await uploadTask.ref.getDownloadURL();

                    await db.collection("photos").add({
                        url: downloadURL,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (error) {
                    console.error("Fehler beim Hochladen:", error);
                    statusDiv.innerText = "Fehler beim Hochladen!";
                    return;
                }
            }

            statusDiv.innerText = "Erfolgreich hochgeladen! ❤️";
            setTimeout(() => { statusDiv.innerText = ""; }, 3000);
        }

        // Lightbox
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
